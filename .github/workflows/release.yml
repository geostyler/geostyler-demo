name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - next

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: geostyler/geostyler-demo

jobs:
  release_semantic_and_npm:
    uses: geostyler/workflows/.github/workflows/release.yml@4483d9e99361ca63c1bce2d528822fbd96b38f68
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  release_docker:
    name: Build and push docker image
    needs: release_semantic_and_npm
    if: needs.release_semantic_and_npm.outputs.tag_name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout sources 🔰
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@3b8fed7e4b60203b2aa0ecc6c6d6d91d12c06760
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release_semantic_and_npm.outputs.tag_name }}
